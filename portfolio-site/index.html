<style>
/* Layout: floating dark window on a gradient ground. Left intro column, centre 3D badge, right socials + projects. */
:root {
  --ground-a: #0a2a8c;
  --ground-b: #3b1a8a;
  --ground-c: #861a5c;
  --ground-d: #b3122c;
  --panel: #0e0f12;
  --panel-2: #15161a;
  --line: #24262c;
  --fg: #f4f5f7;
  --fg-dim: #9a9ea8;
  --window: #050506;
  --accent: var(--accent);
  --accent-rgb: 143,176,255;
  --stage-top: #2f9e5a;
  --stage-mid: #1d3d9a;
  --stage-bottom: #0a0b10;
  --orb-a: #5ec8ff;
  --orb-b: #7a5cff;
  --orb-c: #ff5fa8;
  --radius: 28px;
  --r2: calc(var(--radius) - 8px);
  --max-w: 1760px;
  --max-h: 1120px;
  --title-scale: 1;
  --cols: minmax(280px, 0.85fr) minmax(320px, 1.3fr) minmax(300px, 0.95fr);
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: #0a2a8c;
  background: linear-gradient(180deg, var(--ground-a) 0%, var(--ground-b) 38%, var(--ground-c) 78%, var(--ground-d) 100%) fixed;
  color: var(--fg);
  font-family: var(--font-body);
  padding-inline: clamp(16px, 2vw, 32px);
  padding-block: clamp(16px, 2vw, 32px);
  -webkit-font-smoothing: antialiased;
}
.window {
  max-width: var(--max-w);
  margin-inline: auto;
  background: var(--window);
  border-radius: var(--radius);
  padding: 10px;
  box-shadow: 0 40px 80px -30px rgba(0,0,0,.6);
  display: grid;
  grid-template-columns: var(--cols);
  gap: 10px;
  height: clamp(640px, calc(100vh - 72px), var(--max-h));
}
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
.panel {
  background: var(--panel);
  border-radius: var(--r2);
  min-width: 0;
  position: relative;
  background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.2px);
  background-size: 22px 22px;
}
.nodots .panel { background-image: none; }

.intro { flex: 1; padding: clamp(22px, 1.8vw, 32px); display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.handle { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); letter-spacing: .04em; }
h1 { margin: 0; font-size: calc(clamp(40px, 5vw, 84px) * var(--title-scale)); line-height: .95; letter-spacing: -.035em; font-weight: 700; text-wrap: balance; }
.bio { margin: auto 0 0; color: var(--fg-dim); font-size: clamp(13px, 1.05vw, 16px); line-height: 1.55; max-width: 36ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 11px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--fg-dim); background: var(--panel-2);  transition: color .2s, background .2s, border-color .2s, box-shadow .2s, transform .2s; cursor: default; }
.tag:hover { color: #fff; background: color-mix(in srgb, var(--accent) 16%, var(--panel-2)); border-color: rgba(var(--accent-rgb),.7); box-shadow: 0 0 14px rgba(var(--accent-rgb),.35); transform: translateY(-1px); }
.where { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; border-radius: 14px; background: var(--panel-2); position: relative; overflow: hidden; min-height: 74px; }
.where svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; }
.where > div { position: relative; z-index: 1; }
.where b { display: block; font-size: 14px; font-weight: 700; }
.where span { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
.stage-actions { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); display: flex; gap: 12px; perspective: 700px; z-index: 2; max-width: calc(100% - 24px); }
.gbtn { --mx: 50%; --my: 50%; position: relative; border: 1px solid rgba(255,255,255,.2); font: inherit; font-size: clamp(13px, 1vw, 15px); font-weight: 500; color: #fff; text-decoration: none; text-align: center; white-space: nowrap; cursor: pointer; padding: 14px 28px; border-radius: 99px; min-width: 0; transform-style: preserve-3d;
  background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.07));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 6px 12px -6px rgba(0,0,0,.6);
  transition: transform .25s ease-out, background .2s, box-shadow .25s; will-change: transform; }
.gbtn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .25s; background: radial-gradient(120px circle at var(--mx) var(--my), rgba(var(--accent-rgb),.4), transparent 70%); }
.gbtn span { display: block; position: relative; pointer-events: none; transition: transform .25s ease-out; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
.gbtn.dark { background: linear-gradient(180deg, rgba(var(--accent-rgb),.16), rgba(20,24,40,.4)); border-color: rgba(255,255,255,.14); padding-inline: 24px; }
.gbtn:hover, .gbtn:focus-visible { box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 18px 30px -12px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.08); }
.gbtn:hover::after { opacity: 1; }
.gbtn:hover span { transform: translateZ(18px); }
.gbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.stage { flex: 1; overflow: hidden; border-radius: var(--r2); background:
  radial-gradient(120% 60% at 50% 0%, color-mix(in srgb, var(--stage-top) 55%, transparent), color-mix(in srgb, var(--stage-mid) 35%, transparent) 45%, transparent 75%),
  linear-gradient(180deg, color-mix(in srgb, var(--stage-top) 28%, #000) 0%, color-mix(in srgb, var(--stage-mid) 45%, #000) 45%, var(--stage-bottom) 100%);
  touch-action: pan-y; cursor: grab; }
.stage.drag { cursor: grabbing; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pass-label { position: absolute; right: 18px; bottom: 14px; text-align: right; pointer-events: none; font-size: 12px; font-weight: 500; }
.pass-label small { display: block; font-size: 10px; color: var(--fg-dim); font-weight: 400; }
.hint { position: absolute; left: 18px; bottom: 14px; font-family: var(--font-mono); font-size: 10px; color: var(--fg-dim); pointer-events: none; letter-spacing: .05em; text-transform: uppercase; }

.socials { padding: 14px; flex: 0 0 auto; overflow: hidden; background-image: none; perspective: 800px; perspective-origin: 50% 40%; }
.comb { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
  -webkit-mask-image: radial-gradient(ellipse 62% 60% at var(--cx, 50%) var(--cy, 50%), #000 18%, rgba(0,0,0,.55) 48%, transparent 100%);
          mask-image: radial-gradient(ellipse 62% 60% at var(--cx, 50%) var(--cy, 50%), #000 18%, rgba(0,0,0,.55) 48%, transparent 100%); }
.hexstage { position: relative; width: 100%; max-width: 380px; margin-inline: auto; aspect-ratio: 1 / 0.88; transform-style: preserve-3d; will-change: transform; }
.cell { position: absolute; width: 30%; aspect-ratio: 1 / 1.1547; transform: translate(-50%, -50%); transform-style: preserve-3d; pointer-events: none; display: block; border: 0; padding: 0; background: none; color: var(--fg-dim); text-decoration: none; font: inherit; }
.face { position: absolute; inset: 0; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: rgba(255,255,255,.13); pointer-events: auto; cursor: pointer; transition: transform .35s cubic-bezier(.2,.8,.2,1), background .3s; }
.face::before { content: ""; position: absolute; inset: 1px; clip-path: inherit; background: linear-gradient(160deg, color-mix(in srgb, var(--panel-2) 90%, #fff 6%) 0%, var(--panel) 70%); transition: background .3s; }
.ico { position: absolute; inset: 0; display: grid; place-items: center; transform: translateZ(26px); transition: transform .35s cubic-bezier(.2,.8,.2,1), color .2s; pointer-events: none; }
.ico svg { width: 26px; height: 26px; filter: drop-shadow(0 6px 5px rgba(0,0,0,.55)); }
.ico em { position: absolute; bottom: 22%; font-style: normal; font-size: 10px; opacity: 0; transition: opacity .25s; }
.cell:hover .face, .cell:focus-visible .face { transform: translateZ(14px); background: rgba(var(--accent-rgb),.55); }
.cell:hover .face::before, .cell:focus-visible .face::before { background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 16%, var(--panel-2)) 0%, var(--panel) 75%); }
.cell:hover .ico, .cell:focus-visible .ico { transform: translateZ(48px); color: #fff; }
.cell:hover .ico em, .cell:focus-visible .ico em { opacity: 1; }
.cell:focus-visible { outline: none; }
.cell:focus-visible .face { background: var(--accent); }
.orbcell { position: absolute; width: 30%; aspect-ratio: 1 / 1.1547; transform: translate(-50%, -50%); transform-style: preserve-3d; pointer-events: none; }
.orbcell .face { cursor: default; pointer-events: none; }
.orbcell i { position: absolute; left: 33%; top: 35.5%; width: 34%; aspect-ratio: 1; border-radius: 50%; transform: translateZ(40px); background: conic-gradient(from 200deg, var(--orb-a), var(--orb-b), var(--orb-c), var(--orb-a)); box-shadow: 0 0 26px color-mix(in srgb, var(--orb-b) 70%, transparent), 0 18px 18px rgba(0,0,0,.5); animation: spin 8s linear infinite; }
@keyframes spin { to { transform: translateZ(40px) rotate(360deg); } }

.projects { flex: 1; padding: 18px 14px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: auto; perspective: 700px; perspective-origin: 50% 30%; }
.projects h2 { margin: 0 0 4px 8px; font-size: 13px; font-weight: 500; color: var(--fg-dim); }
.proj { --mx: 50%; --my: 50%; position: relative; display: flex; align-items: center; gap: 16px; padding: 12px 14px; border-radius: 16px; text-decoration: none; color: inherit; transform-style: preserve-3d; transition: transform .25s ease-out, background .2s, box-shadow .25s; background: rgba(255,255,255,.015); flex: none; }
.proj::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .25s; background: radial-gradient(180px circle at var(--mx) var(--my), rgba(var(--accent-rgb),.22), transparent 70%); }
.proj:hover, .proj:focus-visible { background: rgba(255,255,255,.05); box-shadow: 0 18px 30px -12px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.07); }
.proj:hover::after { opacity: 1; }
.thumb { flex: none; width: clamp(40px, 3.2vw, 56px); aspect-ratio: 1; border-radius: 14px; background-size: cover; background-position: center; transition: transform .25s ease-out, box-shadow .25s; box-shadow: 0 2px 4px rgba(0,0,0,.4); }
.proj:hover .thumb { transform: translateZ(34px); box-shadow: 0 16px 18px -4px rgba(0,0,0,.7); }
.proj > div { min-width: 0; transition: transform .25s ease-out; }
.proj:hover > div { transform: translateZ(18px); }
.proj b { display: block; font-size: clamp(13px, 1.05vw, 16px); font-weight: 500; }
.proj span { display: block; font-size: clamp(11px, .85vw, 13px); color: var(--fg-dim); line-height: 1.35; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: #fff; color: #0b0b0d; font-size: 13px; padding: 10px 16px; border-radius: 99px; transition: .25s; pointer-events: none; z-index: 10; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 981px) {
  .window[data-badge="left"] .col.mid { order: -1; }
  .window[data-badge="right"] .col.mid { order: 5; }
}
@media (max-width: 980px) {
  .window { grid-template-columns: 1fr 1fr; height: auto; }
  .col.mid { grid-column: 1 / -1; order: -1; }
  .stage { min-height: 560px; }
  .projects { overflow: visible; }
}
@media (max-width: 640px) {
  .window { grid-template-columns: 1fr; border-radius: 22px; }
  .stage { min-height: 540px; }
  h1 { font-size: calc(48px * var(--title-scale)); }
  .bio { margin-top: 0; }
}
@media (prefers-reduced-motion: reduce) { .orbcell i { animation: none; } }
</style>

<body>
<main class="window" id="win">
  <section class="col">
    <div class="panel intro">
      <div class="handle" id="handle"></div>
      <h1 id="title"></h1>
      <p class="bio" id="bio"></p>
      <div class="tags" id="tags"></div>
      <div class="where">
        <svg id="map" viewBox="0 0 200 74" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
        <div><b id="city"></b><span id="clock"></span></div>
      </div>

    </div>
  </section>

  <section class="col mid">
    <div class="panel stage" id="stage" aria-label="Interactive 3D badge. Drag to swing it.">
      <canvas id="gl"></canvas>
      <div class="stage-actions">
        <button class="gbtn" id="contact" type="button"><span>Contact me</span></button>
        <a class="gbtn dark" id="cv" href="#"><span>CV</span></a>
      </div>
      <div class="hint">Drag the badge</div>
      <div class="pass-label"><span id="passLabel"></span><small id="passSub"></small></div>
    </div>
  </section>

  <section class="col">
    <div class="panel socials" id="socials"><canvas class="comb" id="comb"></canvas><div class="hexstage" id="hexbox"></div></div>
    <div class="panel projects" id="projects"></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

      if (dragging && last) { var dx = p.x - last.x, dy = p.y - last.y; vel.z -= dx * 14; vel.y += dx * 18; vel.x += dy * 10; last = p; }
      else if (!reduce) { var fp = num(E.badge_follow_pointer, 1, 0, 2); tgt.y = p.x * .45 * fp; tgt.x = p.y * .22 * fp; }
    });
    function up() { dragging = false; last = null; stage.classList.remove('drag'); }
    stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
    stage.addEventListener('pointerleave', function () { if (!dragging) { tgt.x = 0; tgt.y = 0; } });

    var clockT = new THREE.Clock(), vis = true;
    document.addEventListener('visibilitychange', function () { vis = !document.hidden; if (vis) clockT.getDelta(); });
    function step() {
      requestAnimationFrame(step); if (!vis) return;
      var dt = Math.min(clockT.getDelta(), .033), t = clockT.elapsedTime;
      var k = 38, cd = 4.2, sway = (reduce || !FX.idle) ? 0 : Math.sin(t * .9) * .025 * num(E.badge_sway, 1, 0, 3);
      vel.x += (-k * (ang.x - tgt.x) - cd * vel.x) * dt; ang.x += vel.x * dt;
      vel.y += (-k * (ang.y - tgt.y) - cd * vel.y) * dt; ang.y += vel.y * dt;
      vel.z += (-k * (ang.z - sway) - cd * vel.z) * dt; ang.z += vel.z * dt;
      pivot.rotation.set(ang.x, ang.y, ang.z);
      sheenMap.offset.x = .25 + ang.y * .35 + ang.z * .2;
      renderer.render(scene, camera);
    }
    step();
  }

  fetch('content.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function () { document.body.insertAdjacentHTML('afterbegin', '<p style="padding:24px">Could not load content.json. Serve this folder over http (for example: npx serve).</p>'); });
})();
</script>
